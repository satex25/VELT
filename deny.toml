# VELT dependency policy — doctrine §5 (legal integrity) mechanised.
#
# This file is a blocking CI gate, not advice. Two things it protects:
#
#   1. Supply chain. Every advisory in the RustSec DB is checked against the
#      resolved graph on every push.
#   2. CMR optionality (doctrine §6). A copyleft crate reaching the statically
#      linked daemon binary would silently foreclose commercial model B
#      (perpetual proprietary license) — an unflagged foreclosure, which §6
#      forbids. The allow-list below is the enforcement point.
#
# Audited 2026-08-02 against the resolved graph: 153 packages, zero crates
# whose only available license is copyleft. `r-efi` is tri-licensed
# (MIT OR Apache-2.0 OR LGPL-2.1-or-later) and is taken under MIT; it is a
# UEFI-target dependency and is not linked on macOS or Linux.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# Empty by design. An ignored advisory must be added here with a written
# reason, which makes the exception reviewable in the diff.
ignore = []

[licenses]
# Permissive only. Adding a license here is a commercial-model decision, not a
# build fix — if a new dependency needs an entry, read §6 before adding it.
# Every entry below is a license actually present in the resolved graph. Five
# speculative entries were removed on 2026-08-02 because `cargo deny` reported
# them as never encountered: "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
# "ISC", "CC0-1.0" and "MPL-2.0".
#
# Removing them is the point rather than a side effect. An allow-list of
# licenses nobody uses is a pre-approval: the day a dependency arrives under
# MPL-2.0 — which is weak copyleft and therefore a §6 question — it would have
# been admitted silently. Now it fails the build and becomes a decision. Re-add
# an entry when a real dependency needs it, in a commit that says why.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
]
confidence-threshold = 0.93

[licenses.private]
# VELT's own crates are `license = "UNLICENSED"`, `publish = false`.
ignore = true

[bans]
# Warn, not deny. `syn` is currently resolved at both 2.0.x and 3.0.x: the 3.x
# copy arrives through serde_derive and utoipa-gen, the 2.x copy through
# tracing-attributes, which has not migrated yet. Nothing in this workspace can
# fix that, and it resolves itself when tracing-attributes updates. Left as a
# warning on purpose — a `skip` entry would silence this one and every future
# duplicate of the same crate, including one that actually mattered.
multiple-versions = "warn"

# A `*` version requirement makes the build non-reproducible. In a system whose
# output is money, that is disqualifying.
wildcards = "deny"

# Scoped exemption: wildcards are tolerated only for private path dependencies
# (crates marked `publish = false`), which resolve to a directory on disk and
# so cannot float. External wildcards remain denied.
#
# The workspace crates now carry explicit versions in Cargo.toml, so this is
# currently a backstop rather than an active allowance — it stops a future
# internal crate added without a version from failing the gate for a
# reproducibility problem it does not have.
allow-wildcard-paths = true

highlight = "all"

deny = [
    { crate = "openssl-sys", reason = "Use rustls. OpenSSL adds a C build dependency, a CVE surface, and a distribution headache for a signed desktop binary." },
    { crate = "openssl", reason = "Use rustls." },
    { crate = "chrono-tz", reason = "Ships a full tzdata copy; if timezone handling is genuinely needed, decide it in a DR first." },
]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
