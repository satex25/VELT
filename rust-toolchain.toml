# Pinned, not floating. A local-first financial terminal is reproducible or it
# is not trustworthy: a toolchain bump must be a reviewable commit, never a
# silent change that lands because someone ran `rustup update` on a Tuesday.
# Bump deliberately, then re-run `just ci`.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
