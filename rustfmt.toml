# `style_edition` is the modern key and is what actually governs formatting
# rules; `edition` only told rustfmt how to parse. Under the 2024 style edition
# `use` statements sort types before functions and long attribute strings wrap,
# which is why this commit reformats a handful of import blocks.
style_edition = "2024"
edition = "2024"
max_width = 100
use_field_init_shorthand = true
