[workspace]
# resolver 3 is the edition-2024 default: it is MSRV-aware, so a transitive
# dependency that raises its own rust-version above ours is rejected at resolve
# time instead of failing the build with a confusing error.
resolver = "3"
members = [
    "crates/velt-money",
    "crates/velt-provenance",
    "crates/velt-engine",
    "crates/velt-connector",
    "crates/velt-store",
    "crates/velt-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 requires 1.85. Verified clean under 1.97.1 via `cargo fix
# --edition` — the migration produced a zero-line diff, so no 2021-era idioms
# remain in the tree.
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# `version` is carried alongside `path` deliberately. A path dependency with no
# version field has an implicit requirement of `*`, and `wildcards = "deny"` in
# deny.toml — which exists to stop an external `serde = "*"` — cannot tell that
# case apart from this one. Stating the version makes the requirement `^0.1.0`,
# so the gate sees a real constraint instead of a wildcard.
#
# These must track [workspace.package] version above. They are private crates
# (`publish = false`), so the version is never resolved from a registry; it
# exists to satisfy the dependency policy and to make the graph self-describing.
velt-money       = { path = "crates/velt-money",      version = "0.1.0" }
velt-provenance  = { path = "crates/velt-provenance", version = "0.1.0" }
velt-engine      = { path = "crates/velt-engine",     version = "0.1.0" }
velt-connector   = { path = "crates/velt-connector",  version = "0.1.0" }
velt-store       = { path = "crates/velt-store",      version = "0.1.0" }

serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.151"
thiserror   = "2.0.19"
utoipa      = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
chrono      = { version = "0.4.45", features = ["serde"] }
uuid        = { version = "1.24.0", features = ["v4", "serde"] }
axum        = "0.8.9"
tokio       = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http  = { version = "0.7.0", features = ["trace", "cors"] }
tracing     = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow      = "1.0.104"
rusqlite    = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
insta       = { version = "1.48.0", features = ["json", "redactions"] }
proptest    = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# HARD CONSTRAINT (doctrine §5): money is integer minor units. f64 is banned in
# financial paths. `float_arithmetic` is denied workspace-wide; the engine and
# money crates additionally forbid the float types outright via
# `disallowed_types` in clippy.toml.
float_arithmetic  = "deny"
lossy_float_literal = "deny"
as_conversions    = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss    = "deny"
arithmetic_side_effects = "deny"
unwrap_used       = "deny"
expect_used       = "warn"
panic             = "deny"
indexing_slicing  = "deny"
todo              = "deny"
unimplemented     = "deny"
dbg_macro         = "deny"

[profile.dev]
# Line tables only. Backtraces and panic locations still resolve; full DWARF
# does not, which is the single largest link-time cost on an incremental build.
debug = 1

[profile.dev.package."*"]
# Optimise dependencies once and cache them forever — they change on the order
# of once a month, while the workspace crates change every minute. This is what
# makes proptest runs and the bundled-SQLite tests bearable in the inner loop.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Deliberately NOT `panic = "abort"`. Clippy denies `panic` in workspace code,
# so a panic here means a bug in a dependency — and on a local-first terminal
# that should surface as a 500 from the axum catch-panic layer, not as the
# whole daemon vanishing mid-session while the user has unsaved analysis open.
