name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing is gained by
# finishing a run against a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # -------------------------------------------------------------------------
  # The Definition of Done (doctrine §9), enforced.
  # -------------------------------------------------------------------------
  gate:
    name: doctrine gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Pinned to the same version as rust-toolchain.toml. A financial terminal
      # that builds against "whatever stable is today" is not reproducible.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binaries. Compiling these from source costs ~8 minutes a run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete

      # No `version:` here on purpose. package.json pins
      # `packageManager: pnpm@9.12.3` as a reproducibility guarantee, and
      # pnpm/action-setup reads that field when no version is given. Stating a
      # version here as well made the two disagree — the action refuses a
      # conflicting pair and failed the job before a single gate ran. Even had
      # it resolved, pnpm 10 against a lockfile written by 9.12.3 would have
      # broken `--frozen-lockfile`. package.json is the single source of truth;
      # bump it there and CI follows.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: extractions/setup-just@v3

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: just fmt-check

      # The f64 ban, the pure-engine rule, the panic ban and the
      # arithmetic-side-effects ban are all clippy gates. This step is why they
      # are constraints and not conventions.
      - name: Lint (f64 ban, purity, panic ban)
        run: just lint

      - name: Tests (snapshot-to-the-cent on financial paths)
        run: cargo nextest run --workspace --profile ci

      - name: Doctests
        run: cargo test --workspace --doc

      # Doctrine §5 legal integrity and §6 CMR optionality.
      - name: Dependency policy (advisories, licences, bans)
        run: just deps

      # Doctrine §7 — blocking gate.
      - name: OpenAPI ↔ TypeScript drift
        run: just drift

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Mutation testing. Separate job because it is slow and must not block fast
  # feedback — but a surviving mutant on a money path still fails the run.
  # -------------------------------------------------------------------------
  mutants:
    name: mutation testing (financial paths)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest

      - uses: extractions/setup-just@v3

      # Not bare `cargo mutants`: it exits non-zero whenever any mutant
      # survives, and two survive with a written proof that no test can kill
      # them, so this job failed on every run since it was added. `just
      # mutants-check` compares the survivors against
      # .config/mutants-expected-survivors.txt and fails only when that set
      # changes — which is the thing actually worth failing on.
      - name: Mutate velt-engine and velt-money
        run: just mutants-check

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
